services:
  db:
    image: mysql:8.0
    container_name: finagent_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-finagent}
      MYSQL_USER: ${DB_USER:-finuser}
      MYSQL_PASSWORD: ${DB_PASS:-finpass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-rootpass}
    ports:
      - "3307:3306"
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db_data: